# Rules registry: every bound the deterministic policy engine enforces.
#
# The LLM never evaluates these. It receives the permitted action set that
# results from them. Each rule_id appears verbatim in the audit trail, so any
# blocked action can be traced back to the clause that blocked it.
#
# VERIFICATION DISCIPLINE
#   verification.status: verified   -> either definitional (follows from our own
#                                      model) or backed by a primary source in
#                                      source_url that matches the parameter
#                        unverified -> the shape is realistic, THE NUMBER IS OURS
#
#   Nothing in the README, the video, or the submission may describe this system
#   as compliant with any regulation while a rule it leans on is `unverified`.
#   The honest claim is: "compliance-bounded by a configurable rules registry
#   modeled on published e-mandate guidance." Rules are enforced either way;
#   verification governs what we may CLAIM, not what we enforce.
version: 1

defaults:
  timezone: Asia/Kolkata

rules:
  # ---------- eligibility: may we present a debit at all ----------
  - id: MANDATE_ACTIVE_REQUIRED
    kind: eligibility
    severity: critical
    harm_metric: true
    summary: No debit may be presented unless the mandate is active.
    params: {}
    verification:
      status: verified
      source_url: null
      note: Definitional, not regulatory. A revoked mandate is withdrawn authorisation.

  - id: MANDATE_VALIDITY_WINDOW
    kind: eligibility
    severity: critical
    harm_metric: true
    summary: A debit may not be scheduled for a time after the mandate valid_till.
    params: {}
    verification: { status: verified, source_url: null, note: Definitional. }

  - id: MANDATE_CAP_RESPECTED
    kind: eligibility
    severity: critical
    harm_metric: true
    summary: Debit amount must not exceed the mandate authorised maximum.
    params: {}
    verification: { status: verified, source_url: null, note: Definitional. }

  - id: PREDEBIT_NOTICE
    kind: compliance
    severity: high
    harm_metric: true
    summary: An e-mandate debit requires advance notice served at least N hours before presentment.
    params:
      notice_hours: 24
      applies_to_rails: [upi_autopay, enach]
    verification:
      status: verified
      source_url: "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13374"
      note: >-
        CONFIRMED, 27 Aug 2026, against RBI/DPSS/2026-27/396 dated 21 April
        2026: "An issuer shall send a pre-transaction notification to the
        customer, at least 24 hours prior to the actual charge / debit." The
        24-hour figure is exact.

        KNOWN DEVIATION, and this one is looser than the rule rather than
        stricter. The framework applies to cards, PPI and UPI. This rule's
        applies_to_rails is [upi_autopay, enach] - so a card_on_file debit is
        presented here WITHOUT requiring a notice, and the framework says it
        needs one. e-NACH, conversely, sits under NPCI's mandate rules rather
        than this framework, so including it is our own conservatism.

        Correcting the scope changes the permitted set, which invalidates every
        recorded agent decision and needs a paid re-run. It is logged as a known
        gap rather than quietly fixed. See docs/CHALLENGES.md C-026.

  - id: AFA_THRESHOLD
    kind: compliance
    severity: high
    harm_metric: true
    summary: Debits at or above the threshold need per-debit authentication and cannot be auto-presented.
    params:
      threshold_paise: 1500000
    verification:
      status: verified
      source_url: "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13374"
      note: >-
        CONFIRMED, 27 Aug 2026, against RBI/DPSS/2026-27/396 "Digital Payments -
        E-mandate Framework, 2026" dated 21 April 2026, which consolidates the
        earlier e-mandate circulars: "All recurring transactions may be
        authorised without AFA up to Rs 15,000/- per transaction. Transactions
        above this amount shall be subject to AFA."

        KNOWN SIMPLIFICATION, stricter than the rule: the same framework permits
        Rs 1,00,000 without AFA for insurance premiums, mutual fund
        subscriptions and credit card bill payments. This world does not model
        payment category, so every invoice is held to Rs 15,000. That costs
        recovery on large invoices; it cannot cause a compliance breach.

  # ---------- rate limits: how hard may we push ----------
  - id: RETRY_CAP_PER_INVOICE
    kind: rate_limit
    severity: high
    harm_metric: false
    summary: Maximum debit presentments per invoice, per rail.
    params:
      card_on_file: 3
      upi_autopay: 4
      enach: 3
    verification:
      status: unverified
      source_url: null
      note: Merchant-policy parameter, not regulation. Ours to choose. Tuned on day 7.

  - id: RETRY_MIN_GAP
    kind: rate_limit
    severity: high
    harm_metric: false
    summary: Minimum gap between presentments, read from the failure code min_retry_gap_hours.
    params:
      source: config/failure_taxonomy.yaml
    verification: { status: unverified, source_url: null, note: Per-code gaps are ours. }

  - id: RISK_COOLOFF
    kind: rate_limit
    severity: high
    harm_metric: false
    summary: After a risk or velocity hold, no presentment for the cooling-off window.
    params:
      hours: 72
    verification:
      status: unverified
      source_url: null
      note: Ours. Re-presenting into a velocity block makes later attempts worse.

  # ---------- contact discipline ----------
  - id: CONTACT_HOURS
    kind: compliance
    severity: critical
    harm_metric: true
    summary: Outbound contact only between the permitted local hours.
    params:
      start_hour: 9
      end_hour: 19
      timezone: Asia/Kolkata
    verification:
      status: analogous
      source_url: "https://www.rbi.org.in/scripts/NotificationUser.aspx?Id=12378&Mode=0"
      note: >-
        ANALOGOUS, not binding. RBI/2022-23/108 dated 12 August 2022 prohibits
        regulated entities and their recovery agents from "calling the borrower
        before 8:00 a.m. and after 7:00 p.m. for recovery of overdue loans".

        It binds banks, AIFIs, NBFCs, HFCs, cooperative banks and ARCs
        recovering LOANS. A merchant collecting a failed subscription debit is
        none of those, so this window is adopted voluntarily as the nearest
        published standard for collections contact in India.

        Our 19:00 end matches exactly. Our 09:00 start is one hour stricter than
        the 08:00 in the circular, deliberately. Nothing in this repository may
        describe this rule as an RBI requirement on merchants, because it is
        not one.

  - id: CONTACT_CHANNEL_RATE
    kind: rate_limit
    severity: high
    harm_metric: true
    summary: At most one outbound message per channel per rolling window.
    params:
      window_hours: 24
      max_per_window: 1
    verification: { status: unverified, source_url: null, note: Merchant-policy parameter, ours. }

  - id: CONTACT_LIFETIME_CAP
    kind: rate_limit
    severity: high
    harm_metric: true
    summary: At most N outbound contacts across the whole life of one invoice.
    params:
      max_contacts: 4
    verification: { status: unverified, source_url: null, note: Merchant-policy parameter, ours. }

  - id: CONSENT_REQUIRED
    kind: compliance
    severity: critical
    harm_metric: true
    summary: A channel may be used only where the customer has recorded consent for it.
    params: {}
    verification:
      status: verified
      source_url: null
      note: Definitional. We model consent as a per-channel flag and honour it.

  - id: DND_SUPPRESSION
    kind: compliance
    severity: critical
    harm_metric: true
    summary: A channel flagged do-not-disturb is suppressed for collection messaging.
    params:
      suppressed_channels: [sms, whatsapp]
    verification:
      status: analogous
      source_url: "https://www.trai.gov.in/faqcategory/unsolicited-commercial-communicationsucc"
      note: >-
        SPLIT SCOPE, checked 27 Aug 2026.

        sms: genuinely in scope. TRAI's TCCCPR and the National Customer
        Preference Register (the DND registry) govern commercial communication
        over telecom resources, which is SMS and voice.

        whatsapp: NOT in TCCCPR scope. TRAI regulates telecom networks; WhatsApp
        is an OTT service and sits outside the DLT/DND regime entirely. We
        suppress it under the same flag anyway, as merchant policy consistent
        with Meta's own opt-in and template rules - not because TRAI requires
        it.

        Marked analogous rather than verified because half the channel list is
        our choice. Suppressing more than the regulation demands cannot cause a
        breach.

  # ---------- stopping rules ----------
  - id: STOP_ON_SETTLED
    kind: stop
    severity: critical
    harm_metric: true
    summary: >-
      Halt immediately once the invoice is settled by any means, including
      payment made outside our flow. A presentment after settlement is a double
      charge and is the worst outcome this system can produce.
    params: {}
    verification: { status: verified, source_url: null, note: Definitional. }

  - id: STOP_ON_HARD_DECLINE
    kind: stop
    severity: critical
    harm_metric: true
    summary: Halt presentments on any failure code of class hard.
    params: {}
    verification: { status: verified, source_url: null, note: Follows from the taxonomy. }

  - id: STOP_ON_DISPUTE
    kind: stop
    severity: critical
    harm_metric: true
    summary: Halt all collection activity except human handoff once a dispute is asserted.
    params: {}
    verification: { status: verified, source_url: null, note: Definitional. }

  - id: STOP_ON_CANCELLATION
    kind: stop
    severity: critical
    harm_metric: true
    summary: Halt at the point a customer cancellation request is received.
    params: {}
    verification: { status: verified, source_url: null, note: Definitional. }

  - id: STOP_ON_INVOICE_AGE
    kind: stop
    severity: medium
    harm_metric: false
    summary: Stop the recovery loop once the invoice passes the age limit; hand off or write off.
    params:
      max_age_days: 30
    verification: { status: unverified, source_url: null, note: Merchant-policy parameter, ours. }

  - id: STOP_ON_ATTEMPTS_EXHAUSTED
    kind: stop
    severity: medium
    harm_metric: false
    summary: Stop once the retry cap or the contact cap is exhausted.
    params: {}
    verification: { status: verified, source_url: null, note: Follows from the rate limits. }

  - id: IDEMPOTENT_ATTEMPT
    kind: eligibility
    severity: critical
    harm_metric: true
    summary: A duplicate failure event for an already-recorded attempt must not produce a second action.
    params: {}
    verification: { status: verified, source_url: null, note: Definitional. }

  # ---------- ladder discipline ----------
  - id: LADDER_MONOTONIC
    kind: eligibility
    severity: medium
    harm_metric: false
    summary: >-
      The ladder may advance at most one rung past the highest rung reached, and
      never descends after a stop condition has fired.
    params:
      max_skip: 1
    verification: { status: verified, source_url: null, note: Design decision, ours. }

  - id: P2P_SINGLE
    kind: rate_limit
    severity: medium
    harm_metric: false
    summary: >-
      At most one promise-to-pay per invoice. A broken promise forces escalation
      to human handoff rather than another promise.
    params:
      max_promises: 1
    verification: { status: verified, source_url: null, note: Design decision, ours. }

  # ---------- authority bounds: things the agent may never do ----------
  - id: NO_REFUND
    kind: authority
    severity: critical
    harm_metric: true
    summary: The agent may never initiate a refund or reversal.
    params: {}
    verification: { status: verified, source_url: null, note: Design decision, ours. }

  - id: NO_MANDATE_INCREASE
    kind: authority
    severity: critical
    harm_metric: true
    summary: >-
      The agent may never raise a mandate cap. Amendment is a customer
      re-authorisation and always leaves the agent authority.
    params: {}
    verification: { status: verified, source_url: null, note: Design decision, ours. }

  - id: NO_DISCOUNT
    kind: authority
    severity: critical
    harm_metric: true
    summary: The agent may never offer a price reduction or write-down to secure payment.
    params: {}
    verification: { status: verified, source_url: null, note: Design decision, ours. }

  - id: GRACE_CAP
    kind: authority
    severity: high
    harm_metric: false
    summary: The agent may grant at most one grace period, of at most one billing cycle.
    params:
      max_grants: 1
      max_cycles: 1
    verification: { status: verified, source_url: null, note: Design decision, ours. }

  - id: NO_VOICE
    kind: authority
    severity: high
    harm_metric: true
    summary: The agent may not place voice calls. Out of scope for v1 by deliberate choice.
    params: {}
    verification:
      status: verified
      source_url: null
      note: Scope decision, ours. See docs/DECISIONS.md D-004.

  - id: NO_THIRD_PARTY_CONTACT
    kind: authority
    severity: critical
    harm_metric: true
    summary: The agent may contact only the payer, never an employer, relative or reference.
    params: {}
    verification:
      status: verified
      source_url: null
      note: Design decision, ours. Third-party contact is a well-known collections abuse.
